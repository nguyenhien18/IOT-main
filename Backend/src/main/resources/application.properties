spring.application.name=iot-room-monitoring-be
spring.config.import=optional:file:./secrets-local.properties

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iot_smart_room1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

spring.jackson.time-zone=Asia/Bangkok
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.sensor-simulation.enabled=${SENSOR_SIMULATION_ENABLED:false}
app.sensor-simulation.interval-ms=${SENSOR_SIMULATION_INTERVAL_MS:5000}
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# OpenAPI / Swagger UI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# MQTT bridge between ESP8266 and the REST/database application.
app.mqtt.enabled=${MQTT_ENABLED:true}
app.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1885}
app.mqtt.client-id=${MQTT_CLIENT_ID:iot-room-backend}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.sensor-topic=${MQTT_SENSOR_TOPIC:sensor_data}
app.mqtt.control-topic=${MQTT_CONTROL_TOPIC:device_control}
app.mqtt.feedback-topic=${MQTT_FEEDBACK_TOPIC:device_feedback}
app.mqtt.qos=${MQTT_QOS:1}
app.mqtt.connection-timeout-seconds=${MQTT_CONNECTION_TIMEOUT_SECONDS:3}
app.mqtt.reconnect-delay-ms=${MQTT_RECONNECT_DELAY_MS:5000}
app.mqtt.command-timeout-ms=${MQTT_COMMAND_TIMEOUT_MS:5000}
